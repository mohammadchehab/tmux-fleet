version: '3'

# The TypeScript workspace under packages/ and apps/, checked by `pnpm typecheck` and `pnpm test`.
#
# v1 — the bash fleet that this checkout used to carry under legacy/v1/ — has been deleted, and its git history is
# where it now lives (`git log -- legacy/v1`). Its Taskfile, its smoke suite and its install targets went with it:
# `task test` runs the TypeScript suite and nothing else, which is the one gate on a PR.

tasks:
  default:
    desc: List the tasks
    silent: true
    cmds:
      - task --list

  install:
    desc: Install the TypeScript packages' dev dependencies (pnpm) and link @fleet/* to the sibling packages
    cmds:
      - pnpm install --frozen-lockfile

  typecheck:
    desc: Typecheck every TypeScript package and the cross-package tests (strict, no emit, erasable syntax only) — the gate node --experimental-strip-types cannot give
    cmds:
      - pnpm typecheck

  test:node:
    desc: Run the TypeScript tests with the built-in runner — tests/ (the §1.1 architecture rules) and every package's own test/
    cmds:
      - pnpm test

  test:
    desc: Run the TypeScript tests and the typecheck — the whole gate, and the only one that exists since v1 was removed
    cmds:
      - task: test:node
      - task: typecheck
