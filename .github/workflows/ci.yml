# The merge gate (docs/runbook/ci.md). One job:
#
#   checks     every PR and every push to main: typecheck and test the TypeScript workspace, including
#              tests/architecture, from a clean checkout. This is the required status check on main.
#
# v1's own lint and smoke job went with legacy/v1/ (git history: `git log -- legacy/v1`): there is nothing left in
# this checkout that it could prove.
#
# Security scanning is its own workflow (security.yml) because it also runs nightly on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels the run it supersedes — the queue stays one deep per PR. main is never cancelled: each
# commit there is a merge that was already green, and its run is the record that CI kept it that way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from package.json's packageManager field — one pin, not two.
      - uses: pnpm/action-setup@v6

      # Node comes from .node-version: the floor package.json's engines promises (>=22.18), so CI tests what a fresh
      # machine gets, not the version on the machine of whoever wrote the change. Cache the pnpm store, keyed on the
      # lockfile.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # --frozen-lockfile: a dependency added without its lockfile change fails here, not on someone's laptop.
      - name: install
        run: pnpm install --frozen-lockfile

      # The compiler is the lint (AGENTS.md): tsc --noEmit --strict over packages/, apps/ and tests/.
      - name: typecheck
        run: pnpm typecheck

      # node --test over every package's test/ and tests/ (the §1.1 dependency rules and the provider conformance suite).
      - name: test
        run: pnpm test

      # The gate runs on a clean checkout, so it must leave one behind: a test that writes into the tree would pass
      # here and fail the next person whose checkout is dirty. Ignored paths (node_modules/, *.tsbuildinfo) do not count.
      - name: the suite leaves the checkout clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::a test wrote into the checkout; the tree must be clean after pnpm test"
            exit 1
          fi

  # Evals (§17) are phase 2 and are not wired. When they land they belong here, as a second job gated on paths, so the
  # cost only falls on PRs that can move an eval:
  #
  #   evals:
  #     if: >
  #       github.event_name == 'pull_request' && (
  #         contains(github.event.pull_request.changed_files, …)   # roles, Judge prompts and question schemas,
  #       )                                                        # model and limits config, the StateFile schema
  #     runs-on: ubuntu-latest
  #     steps: …  fleet evals run <suite>, compare against tests/evals/baselines/<suite>.json …
  #
  # GitHub gives no path glob in `if:`, so the gate is a tiny step that filters `git diff --name-only` over the base.
